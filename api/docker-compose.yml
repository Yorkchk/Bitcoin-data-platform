services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - app/.env
    depends_on:
      - redis
    networks:
      - bitcoin-network
  
  nginx:
    # Context is the repo root so the image can build ../frontend and serve it.
    build:
      context: ..
      dockerfile: api/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - bitcoin-network


  redis:
    image: redis:latest
    networks:
      - bitcoin-network

networks:
  bitcoin-network:
    driver: bridge