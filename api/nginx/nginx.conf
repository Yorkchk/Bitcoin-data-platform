server {
    listen 80;
    server_name _; # Replace with your domain (e.g., api.yourdomain.com)

    # 1. Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 2. Headers and timeouts for every proxied request
    #    (timeouts are generous: the SQL database can take a while to wake up)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;

    # 3. API for the frontend: /api/get_liveChart -> app:8000/get_liveChart
    location /api/ {
        proxy_pass http://app:8000/;
    }

    # 4. The API's original root paths keep working (Swagger UI, existing clients, curl examples)
    location ~ ^/(generareApi|get_historyChart|get_liveChart|get_historyOhlc|get_liveOhlc|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://app:8000;
    }

    # 5. Frontend (static files built into the image)
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so browsers can cache them for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/history, /candles, ...) all load the app shell
    location / {
        try_files $uri /index.html;
    }

    # 6. Max file upload size (default is only 1MB)
    client_max_body_size 20M;
}
